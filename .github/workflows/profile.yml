name: Profile

# check: 그림·README 숫자가 scripts/data 자료와 같은지 본다(회사 자료는 로컬에서만 모은다).
# snake: 매일 잔디 뱀을 초콜릿 색으로 다시 그려 output 브랜치에 올린다.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "40 15 * * *" # 매일 KST 00:40
  workflow_dispatch:

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build.mjs --check

  snake:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: snake
      cancel-in-progress: false
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#C8551F&color_dots=#F1E4D6,#E3C2A2,#C98F5E,#9C5B33,#5C301B
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF8A4C&color_dots=#161b22,#47301F,#76482B,#B26937,#F0A061
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
